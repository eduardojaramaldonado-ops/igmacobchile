<!DOCTYPE html>
<html lang="es-CL">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- NOINDEX siempre (página interna) -->
    <meta name="robots" content="noindex, nofollow">

    <title>Mensaje enviado | Igmacob Chile</title>
    <meta name="description" content="Recibimos tu mensaje. Nuestro equipo de Igmacob Chile te responderá a la brevedad, generalmente dentro de las próximas 24 horas hábiles.">
    <link rel="canonical" href="https://igmacobchile.cl/gracias/">

    <meta property="og:locale" content="es_CL">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Mensaje enviado | Igmacob Chile">
    <meta property="og:description" content="Recibimos tu mensaje. Nuestro equipo de Igmacob Chile te responderá a la brevedad.">
    <meta property="og:url" content="https://igmacobchile.cl/gracias/">
    <meta property="og:site_name" content="Igmacob Chile">

    <link rel="icon" href="https://igmacobchile.cl/wp-content/uploads/2024/10/fav-150x150.png" sizes="32x32">
    <link rel="icon" href="https://igmacobchile.cl/wp-content/uploads/2024/10/fav-300x300.png" sizes="192x192">
    <link rel="apple-touch-icon" href="https://igmacobchile.cl/wp-content/uploads/2024/10/fav-300x300.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css?v=18">

    <style>
        .gracias-wrap{
            min-height:calc(100vh - 120px);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:120px 20px 80px;
            text-align:center;
        }
        .gracias-box{
            max-width:640px;
        }
        .gracias-icon{
            width:96px;
            height:96px;
            border-radius:50%;
            background:linear-gradient(90deg,#09ace5,#00df72);
            color:#fff;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            font-size:42px;
            margin-bottom:28px;
            box-shadow:0 12px 30px rgba(9,172,229,0.25);
        }
        .gracias-icon.error{
            background:linear-gradient(90deg,#ff5d5d,#ff8c42);
            box-shadow:0 12px 30px rgba(255,93,93,0.25);
        }
        .gracias-box h1{
            font-family:'Montserrat','Inter',sans-serif;
            font-size:40px;
            font-weight:700;
            color:#000081;
            margin-bottom:18px;
            line-height:1.2;
        }
        .gracias-box p{
            font-size:18px;
            color:#5f6470;
            margin-bottom:32px;
            line-height:1.6;
        }
        .gracias-cta{
            display:inline-flex;
            align-items:center;
            gap:10px;
            padding:16px 32px;
            background:linear-gradient(90deg,#09ace5,#00df72);
            color:#fff;
            border-radius:12px;
            text-decoration:none;
            font-weight:700;
            transition:0.3s;
        }
        .gracias-cta:hover{
            transform:translateY(-3px);
            background:linear-gradient(90deg,#00df72,#09ace5);
        }
    </style>

</head>

<body>

    <header class="header">
        <div class="container header-container">
            <a href="../" class="logo">
                <img src="../assets/img/2024/10/logo.png" alt="Igmacob Chile">
            </a>
        </div>
    </header>

    <main class="gracias-wrap">
        <div class="gracias-box" id="gracias-content">
            <!-- contenido inyectado por JS según el query string -->
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="container footer-bottom-inner">
                <p>&copy; 2025 Igmacob Chile. Todos los derechos reservados.</p>
                <p>Diseñado por <a href="#" target="_blank" rel="noopener">GoPoint Agency</a></p>
            </div>
        </div>
    </footer>

    <script>
        (function(){
            var qs = new URLSearchParams(location.search);
            var ok = qs.get('ok');
            var error = qs.get('error');
            var box = document.getElementById('gracias-content');

            var messages = {
                ok: {
                    icon: 'fa-check',
                    title: '¡Mensaje enviado!',
                    text: 'Gracias por contactarte con Igmacob Chile. Nuestro equipo te responderá a la brevedad, generalmente dentro de las próximas 24 horas hábiles.',
                    cls: ''
                },
                campos: {
                    icon: 'fa-triangle-exclamation',
                    title: 'Faltan campos',
                    text: 'Algunos campos obligatorios quedaron vacíos. Por favor, volvé al formulario y completalos.',
                    cls: 'error'
                },
                email: {
                    icon: 'fa-envelope-circle-check',
                    title: 'Email inválido',
                    text: 'El email que ingresaste no tiene un formato válido. Por favor, revisalo e intentá nuevamente.',
                    cls: 'error'
                },
                server: {
                    icon: 'fa-server',
                    title: 'Error en el servidor',
                    text: 'Tuvimos un problema enviando el mensaje. Por favor, intentá de nuevo en unos minutos o escribinos por WhatsApp.',
                    cls: 'error'
                }
            };

            var msg = ok ? messages.ok : (messages[error] || messages.ok);

            box.innerHTML =
                '<div class="gracias-icon ' + msg.cls + '"><i class="fa-solid ' + msg.icon + '"></i></div>' +
                '<h1>' + msg.title + '</h1>' +
                '<p>' + msg.text + '</p>' +
                '<a href="../" class="gracias-cta"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>';
        })();
    </script>

</body>
</html>
